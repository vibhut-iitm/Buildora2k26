<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex flex-column justify-content-center align-items-center vh-100">

    <div id="resultBox" class="text-center">
        <h2 id="statusText">Waiting...</h2>
        <p id="studentName"></p>
        <a href="scan.html" class="btn btn-primary mt-3">Scan Next</a>
    </div>

    <script>
        const status = localStorage.getItem("status");
        const name = localStorage.getItem("name");

        const statusText = document.getElementById("statusText");
        const studentName = document.getElementById("studentName");

        if (status === "valid") {
            statusText.innerText = "Entry Allowed";
            statusText.classList.add("text-success");
            studentName.innerText = name || "";
        } else if (status === "used") {
            statusText.innerText = "Already Used";
            statusText.classList.add("text-warning");
        } else {
            statusText.innerText = "Invalid Pass";
            statusText.classList.add("text-danger");
        }
    </script>

</body>
</html>
